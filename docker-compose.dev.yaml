services:
  api:
    build: 
      context: .
      dockerfile: Dockerfile.dev
    command: ./.docker/local-dev.sh
    container_name: nogain-dev-api
    ports:
      - '5000:5000'
    volumes:
      - .:/home/node/app
      
    extra_hosts:
      - "host.docker.internal:host-gateway"

  db:
    image: postgres:18-alpine
    container_name: nogain-dev-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - ./.docker/postgres/data:/var/lib/postgresql
    ports:
    - "5432:5432"

  otel-collector:
    image: otel/opentelemetry-collector-contrib
    container_name: nogain-otel-collector
    command: ["--config", "/etc/otel-config.yaml"]
    ports:
      - "4318:4318" # OTLP Http (metrics/traces)
      - "4317:4317" # OTLP gRpc (trace)
      - "8888:8888" # Heath check
      - "8889:8889" # Prometheus metric
    volumes:
      - ./otel-config.yaml:/etc/otel-config.yaml
  
  tempo:
    image: grafana/tempo
    container_name: nogain-tempo
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml
    ports:
      - "3200:3200"
      

  prometheus:
    image: prom/prometheus
    container_name: nogain-prometheus
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana
    container_name: nogain-grafana
    ports:
      - "3001:3000"

    