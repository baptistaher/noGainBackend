receivers:
  otlp:
    protocols:
      http:
        endpoint: "localhost:4318"
      # grpc:
      #   endpoint: 0.0.0.0:4317

exporters:
  otlp/tempo:
    endpoint: "http://tempo:3200"
    tls:
      insecure: true

  prometheus:
    endpoint: "0.0.0.0:8889"


processors:
  batch:
    # send_batch_max_size: 100
    # timeout: 3s

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/tempo]

    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
